<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#315974"/></marker></defs><rect width="1200" height="720" fill="#f4f7fa"/><g font-family="Arial,sans-serif" fill="#172b3a"><text x="40" y="50" font-size="28" font-weight="700">MVP - Sprint: Arquitetura de Software</text><text x="40" y="84" font-size="18" font-weight="400">Cenário 1.1 · Planejamento de coletas e entregas · Marcio Almeida da Silva</text><rect x="30" y="112" width="820" height="450" rx="20" fill="#e8eff5" stroke="#bdcddb"/><text x="55" y="146" font-size="16" font-weight="700">AMBIENTE DOCKER · componentes desenvolvidos + persistência</text><rect x="55" y="197" width="260" height="150" rx="12" fill="#fff" stroke="#315974" stroke-width="2"/><text x="75" y="232" font-size="22" font-weight="700">Interface React</text><text x="75" y="264" font-size="15" font-weight="400">Nginx serve HTML, CSS e JS</text><text x="75" y="291" font-size="15" font-weight="400">Navegador: localhost:8080</text><text x="75" y="318" font-size="15" font-weight="400">Repositório frontend · Dockerfile</text><rect x="475" y="197" width="345" height="150" rx="12" fill="#fff" stroke="#315974" stroke-width="2"/><text x="495" y="232" font-size="22" font-weight="700">API própria · FastAPI</text><text x="495" y="264" font-size="15" font-weight="400">Python · regras e integrações</text><text x="495" y="291" font-size="15" font-weight="400">backend:8000 · Swagger :8001/docs</text><text x="495" y="318" font-size="15" font-weight="400">Repositório backend · Dockerfile</text><rect x="475" y="432" width="345" height="110" rx="12" fill="#e4f4ec" stroke="#315974" stroke-width="2"/><text x="495" y="467" font-size="22" font-weight="700">MySQL · db:3306</text><text x="495" y="499" font-size="15" font-weight="400">Clientes, entregas e rotas</text><text x="495" y="526" font-size="15" font-weight="400">Volume mysql_data · SQLAlchemy</text><rect x="910" y="157" width="265" height="165" rx="12" fill="#fff1dc" stroke="#315974" stroke-width="2"/><text x="930" y="192" font-size="22" font-weight="700">Nominatim</text><text x="930" y="224" font-size="15" font-weight="400">API externa · endereços</text><text x="930" y="251" font-size="15" font-weight="400">GET /search</text><text x="930" y="278" font-size="15" font-weight="400">GET /reverse</text><rect x="910" y="388" width="265" height="165" rx="12" fill="#fff1dc" stroke="#315974" stroke-width="2"/><text x="930" y="423" font-size="22" font-weight="700">OSRM</text><text x="930" y="455" font-size="15" font-weight="400">API externa · trajetos</text><text x="930" y="482" font-size="15" font-weight="400">GET /route/v1/driving/…</text><text x="930" y="509" font-size="15" font-weight="400">GET /table/v1/driving/…</text><path d="M315 268H471" fill="none" stroke="#315974" stroke-width="3" marker-end="url(#a)"/><text x="335" y="231" font-size="15" font-weight="400">HTTP / JSON</text><text x="335" y="251" font-size="14" font-weight="400">/api via Nginx</text><text x="329" y="299" font-size="13" font-weight="400">GET · POST · PUT</text><text x="365" y="318" font-size="13" font-weight="400">DELETE</text><path d="M650 347V428" fill="none" stroke="#315974" stroke-width="3" marker-end="url(#a)"/><text x="667" y="394" font-size="16" font-weight="400">SQL</text><path d="M820 237H906" fill="none" stroke="#315974" stroke-width="3" marker-end="url(#a)"/><path d="M820 304H873V468H906" fill="none" stroke="#315974" stroke-width="3" marker-end="url(#a)"/><text x="913" y="140" font-size="12" font-weight="400">HTTPS / JSON</text><text x="55" y="432" font-size="16" font-weight="700">Interações na mesma aplicação</text><text x="55" y="464" font-size="16" font-weight="400">Alvo no mapa · entregas avulsas</text><text x="55" y="492" font-size="16" font-weight="400">Ordenação · cálculo · matriz</text><text x="55" y="520" font-size="16" font-weight="400">Mensagens de erro e orientação</text><text x="40" y="614" font-size="18" font-weight="700">Dois componentes próprios, preparados para repositórios separados.</text><text x="40" y="646" font-size="16" font-weight="400">A API trata as respostas externas; o usuário não é redirecionado. O banco persiste os dados.</text><text x="40" y="679" font-size="15" font-weight="400">Recursos adicionais: o navegador carrega tiles OpenStreetMap e ícones. Dados OSM: ODbL.</text></g></svg>